{% extends 'base.html' %}

{% block title %}Register – Shopping Recommendation System{% endblock %}

{% block content %}
<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 bg-white">
        <div class="text-center mb-4">
          <div class="brand-icon mx-auto mb-2" style="width: 48px; height: 48px; font-size: 1.4rem;">
            <i class="bi bi-person-plus-fill"></i>
          </div>
          <h3 class="fw-bold text-dark">Create Account</h3>
          <p class="text-muted small">Join Shopping Recommendation System and experience smart recommendation tracking</p>
        </div>

        <form action="{{ url_for('register') }}" method="POST">
          <div class="mb-3">
            <label class="form-label small fw-bold text-muted">Full Name</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person"></i></span>
              <input type="text" name="name" class="form-control rounded-end-3" placeholder="Jane Doe" required>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label small fw-bold text-muted">Email Address</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
              <input type="email" name="email" class="form-control rounded-end-3" placeholder="name@example.com" required>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label small fw-bold text-muted">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-shield-lock"></i></span>
              <input type="password" name="password" class="form-control rounded-end-3" placeholder="At least 6 characters" minlength="6" required>
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label small fw-bold text-muted">Confirm Password</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-shield-check"></i></span>
              <input type="password" name="confirm_password" class="form-control rounded-end-3" placeholder="Re-enter password" minlength="6" required>
            </div>
          </div>

          <button type="submit" class="btn btn-primary-custom w-100 py-2 rounded-pill fw-bold mb-3" id="submit-register-btn">
            Create Free Account
          </button>
        </form>

        <div class="text-center text-muted small">
          Already registered? <a href="{{ url_for('login') }}" class="text-primary fw-bold text-decoration-none">Log In</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
